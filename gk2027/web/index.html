<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>高考复习</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>

<!-- 登录页 -->
<div id="loginPage" class="page hidden">
  <div class="login-box">
    <h2>👋 你是谁？</h2>
    <div id="loginUsers"></div>
    <div class="login-divider">—— 或新同学 ——</div>
    <input id="newName" type="text" placeholder="名字（如：小明）" maxlength="12">
    <input id="loginPwd" type="password" placeholder="密码（新账号即设为初始密码）" maxlength="32">
    <input id="loginCode" type="password" placeholder="准入码" maxlength="32" hidden>
    <button id="loginBtn" class="primary" disabled>✨ 登录 / 开始使用</button>
    <p class="tip">密码保护你的日记与学习数据。每个人的进度、错题、复习卡片独立保存，互不影响。</p>
  </div>
</div>

<!-- 主界面 -->
<div id="mainPage" class="hidden">
  <div id="headerBar" class="header"></div>

  <div id="tabLearn" class="page tab-page"></div>
  <div id="tabExam" class="page tab-page hidden"></div>
  <div id="tabReview" class="page tab-page hidden"></div>
  <div id="tabStats" class="page tab-page hidden"></div>
  <div id="tabRecite" class="page tab-page hidden"></div>
  <div id="tabExport" class="page tab-page hidden"></div>
  <div id="tabSpace" class="page tab-page hidden"></div>
  <div id="tabMine" class="page tab-page hidden"></div>
  <div id="tabSettings" class="page tab-page hidden"></div>

  <nav id="navBar" class="nav">
    <button data-tab="tabLearn" class="nav-btn active">📚 学习</button>
    <button data-tab="tabExam" class="nav-btn">🎯 真题</button>
    <button data-tab="tabReview" class="nav-btn">🔁 复习</button>
    <button data-tab="tabMine" class="nav-btn">👤 我的</button>
  </nav>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/web/app.js"></script>
</body>
</html>
